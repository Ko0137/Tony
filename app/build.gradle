plugins {
    id 'com.android.application'
}

android {
    signingConfigs {
        releaseConfig {
            keyAlias 'lira-key'
            keyPassword 'lirapass123'
            storeFile file('release.keystore')
            storePassword 'lirapass123'
        }
    }

    namespace 'com.lira.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lira.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
